name: Aegis Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test, Seed & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository hygiene (no committed .env or .local state)
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be committed to git"
            exit 1
          fi
          if [ -n "$(git ls-files '.local/*')" ]; then
            echo "ERROR: .local/ runtime artifacts must not be committed to git"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript static analysis
        run: pnpm typecheck

      - name: Run unit, integration, and security test suites
        run: pnpm test

      - name: Verify deterministic workspace seed (AI_MODE=demo)
        run: pnpm seed

      - name: Build production frontend bundle
        run: pnpm build
