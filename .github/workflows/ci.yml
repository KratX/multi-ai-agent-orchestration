name: Ordaris Runtime CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Ordaris Runtime — Hygiene, Typecheck, Test, Seed & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AI_MODE: demo
      DB_DRIVER: pglite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Ordaris Runtime repository & secret hygiene
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be committed to git"
            exit 1
          fi
          if [ -n "$(git ls-files '.local/*')" ]; then
            echo "ERROR: .local/ runtime artifacts must not be committed to git"
            exit 1
          fi
          if grep -rnI -E "(AI[z]a[0-9A-Za-z_-]{10,}|sk-[p]roj-[0-9A-Za-z_-]{8,}|sk-[a]nt-[0-9A-Za-z_-]{8,}|sk-[o]r-v1-[0-9A-Za-z_-]{8,}|xa[i]-[0-9A-Za-z_-]{8,}|gh[p]_[0-9A-Za-z]{16,}|github_[p]at_[0-9A-Za-z_]{16,})" src/ tests/ docs/ server.ts README.md .env.example; then
            echo "ERROR: Secret-scanner-triggering key pattern detected in repository files"
            exit 1
          fi
          if grep -rnI -i -E "ae[g]is" .github/ .gitignore src/ tests/ README.md package.json; then
            echo "ERROR: Legacy branding detected in repository files"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Run Ordaris Runtime TypeScript static analysis
        run: pnpm run typecheck

      - name: Run Ordaris Runtime unit & security test suites
        run: |
          pnpm run test:unit
          pnpm run test:security

      - name: Run Ordaris Runtime PostgreSQL & HTTP integration tests
        run: pnpm run test:integration

      - name: Verify deterministic workspace seed (AI_MODE=demo)
        run: pnpm run seed

      - name: Build Ordaris Runtime production frontend & backend bundle
        run: pnpm run build
